name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.2.0

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Mirrors minecraft-afk-bot's release.yml: a git tag of v0.1.0
      # publishes 0.1.0, never `latest` — the chart pins a tag, and a moving
      # one would reintroduce a silent-upgrade hazard on a stateful,
      # always-connected process.
      - id: version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/minecraft-server-agent
          tags: type=raw,value=unused
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      # gophertunnel's RakNet implementation is pure Go (no cgo), unlike
      # minecraft-afk-bot's native raknet-native addon, but the deployment
      # target is amd64-only Talos nodes, so a multi-arch build would cost
      # CI time for a platform nothing pulls.
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/minecraft-server-agent:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/minecraft-server-agent:sha-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
