name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version to publish, with or without a leading v
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.2.0

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is the redundant copy, not what the cluster pulls from
      # (that stays ghcr.io, matching minecraft-afk-bot) - dual-published so
      # the image survives a GHCR-specific outage or policy change. Requires
      # DOCKERHUB_USERNAME/DOCKERHUB_TOKEN repo secrets, set by a human
      # outside CI (an access token is a credential, never minted or pasted
      # through an agent's shell).
      - uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # A tag of v0.1.0 publishes 0.1.0, never `latest` — the chart pins a tag,
      # and a moving one would reintroduce a silent-upgrade hazard on a
      # stateful, always-connected process.
      - id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          raw="${TAG:-$GITHUB_REF_NAME}"
          version="${raw#v}"
          case "$version" in
            [0-9]*) ;;
            *)
              echo "::error::release version must start with a digit: $version"
              exit 1
              ;;
          esac
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/minecraft-server-agent
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/minecraft-server-agent
          tags: type=raw,value=${{ steps.version.outputs.value }}

      # The deployment target is amd64-only Talos nodes, so a multi-arch build
      # would cost CI time for a platform nothing pulls.
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
